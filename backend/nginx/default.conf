server {
    # 1. Matching되는 도메인이 없으면 이 블록이 '기본 창구'로 처리함
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name _;

    # 443(HTTPS)으로 요청이 오더라도 SSL 악수(인증서 교환) 단계에서 즉시 거절
    ssl_reject_handshake on;

    # 연결을 즉시 강제 종료 (Non-standard Nginx code)
    return 444;
}

# HTTP (80 포트) -> HTTPS (443 포트) 리다이렉트 블록
server {
    listen 80;
    server_name ip-172-31-33-118.tail1d9f85.ts.net;

    # 모든 HTTP 요청을 HTTPS로 301 리다이렉션
    return 301 https://$host$request_uri;
}

# HTTPS (443 포트) 실제 서비스 블록
server {
    listen 443 ssl;
    server_name ip-172-31-33-118.tail1d9f85.ts.net;

    # 마운트된 컨테이너 내부 인증서 경로
    ssl_certificate     /etc/nginx/certs/ts.crt;
    ssl_certificate_key /etc/nginx/certs/ts.key;

    # 권장 SSL 프로토콜 및 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        # Docker network 내부에서 backend 컨테이너의 8080 포트로 전달
        proxy_pass http://backend:8080;

        # 클라이언트가 요청한 원래 호스트명을 백엔드에 전달
        proxy_set_header Host $host;
        # 클라이언트의 실제 IP 주소를 백엔드에 전달
        proxy_set_header X-Real-IP $remote_addr;
        # 프록시를 거쳐온 클라이언트 IP 목록에 현재 클라이언트 IP를 추가해 전달
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 원래 클라이언트 요청이 HTTP인지 HTTPS인지 전달
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 업그레이드 요청 헤더를 백엔드에 전달
        proxy_set_header Upgrade $http_upgrade;
        # WebSocket 연결을 위해 연결 업그레이드 정보를 전달
        proxy_set_header Connection "upgrade";
    }

    location /actuator {
        deny all;
        return 404;
    }
}
