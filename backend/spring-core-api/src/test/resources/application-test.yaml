spring:
  datasource:
    url: jdbc:h2:mem:ecommerce-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 만들고, Hibernate는 엔티티와 일치하는지 검사만 함
    show-sql: true
    properties:
      hibernate:
        format_sql: true
