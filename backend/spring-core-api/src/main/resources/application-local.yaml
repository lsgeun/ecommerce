spring:
  # datasource는 Docker Compose(compose.yaml)의 MySQL 컨테이너 접속 정보로 자동 주입
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  use-fqn: true
  packages-to-scan: io.github.lsgeun

  swagger-ui:
    enabled: true
    display-request-duration: true
    operations-sorter: alpha

  api-docs:
    enabled: true
