plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.lsgeun'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	enabled = false // plain.jar 생성 안 함
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// ArchUnit JUnit 5
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	compileOnly 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
	enabled = false // 계층별 태스크(unitTest 등)로 대체
}

def configureTestTask = {
	useJUnitPlatform()

	// Gradle 실행 시 콘솔에 개별 테스트 결과 출력 설정
	testLogging {
		events "passed", "skipped", "failed"

		// ParameterizedTest 실행 시 주입된 파라미터 이름 및 DisplayName 표시
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

tasks.register('unitTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'unit' }
}

tasks.register('sliceTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'slice' }
}

tasks.register('integrationTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'integration' }
}

tasks.register('e2eTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'e2e' }
}

// 단위 -> 슬라이스 -> 통합 -> e2e 순으로 실행되며, 앞 단계 실패 시 뒤 단계는 실행되지 않음(fail-fast)
sliceTest.mustRunAfter unitTest
integrationTest.mustRunAfter sliceTest
e2eTest.mustRunAfter integrationTest

tasks.register('testAll') {
	dependsOn unitTest, sliceTest, integrationTest, e2eTest
}

tasks.named('check') {
	dependsOn testAll
}
