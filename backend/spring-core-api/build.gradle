plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.lsgeun'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	enabled = false // plain.jar 생성 안 함
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// ArchUnit JUnit 5
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	compileOnly 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
}

def configureTestTask = {
	useJUnitPlatform()

    // @ActiveProfiles를 빠뜨린 테스트가 local 프로파일로 실제 DB에 붙는 것을 막음
    systemProperty 'spring.profiles.active', 'test'

	// Gradle 실행 시 콘솔에 개별 테스트 결과 출력 설정
	testLogging {
		events "passed", "skipped", "failed"

		// ParameterizedTest 실행 시 주입된 파라미터 이름 및 DisplayName 표시
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

tasks.register('unitTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'unit' }
}

tasks.register('sliceTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'slice' }
}

tasks.register('integrationTest', Test) {
	configure(configureTestTask)
	useJUnitPlatform { includeTags 'integration' }
}

// 단위 -> 슬라이스 -> 통합 순으로 실행
// 앞 단계 실패 시 뒤 단계는 실행되지 않음(fail-fast)
sliceTest.mustRunAfter unitTest
integrationTest.mustRunAfter sliceTest

// 단위, 슬라이스, 통합 순으로 테스트 코드 실행 후,
// 나머지 테스트 코드 실행
tasks.named('test') {
    configure(configureTestTask)
    useJUnitPlatform { excludeTags 'unit', 'slice', 'integration' }
    dependsOn unitTest, sliceTest, integrationTest
}
