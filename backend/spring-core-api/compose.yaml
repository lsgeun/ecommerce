# local 개발용 MySQL. bootRun 시 Spring Boot가 자동으로 띄우고 접속 정보를 연결함
# 서버용 backend/docker-compose.yaml과 달리 DB만 포함
services:
  mysql:
    image: mysql:8.0
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: local
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트 포트를 비워 두면 충돌 없이 임의 포트가 배정되고 Spring Boot가 찾아서 연결함
      - "3306"
    volumes:
      # 앱을 재시작해도 데이터가 유지되도록 named volume 사용
      - mysql-local-data:/var/lib/mysql

volumes:
  mysql-local-data:
