server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:ecommerce-dev;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  use-fqn: true
  packages-to-scan: io.github.lsgeun

  swagger-ui:
    enabled: true
    display-request-duration: true
    operations-sorter: alpha

  api-docs:
    enabled: true
