services:
  prometheus:
    image: prom/prometheus:latest
    container_name: local-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus-config.yml:/etc/prometheus/prometheus-config.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus-config.yml'
      - '--storage.tsdb.retention.time=1d' # 로컬용 1일 보관

  loki:
    image: grafana/loki:2.9.0
    container_name: local-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100" # 원격 Promtail이 이 포트로 로그를 쏩니다.
    volumes:
      # 로컬의 loki-config.yaml을 컨테이너 내부로 읽기 전용(:ro) 매핑
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: local-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin # 초기 아이디
      - GF_SECURITY_ADMIN_PASSWORD=admin # 초기 비밀번호
      - GF_USERS_ALLOW_SIGN_UP=false # 회원가입 금지
      - GF_USERS_DEFAULT_THEME=light # 기본 테마 밝음
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/grafana.db:/var/lib/grafana/grafana.db:rw # 설정, 비밀번호 등의 대부분의 데이터 저장
    depends_on:
      - prometheus
      - loki
