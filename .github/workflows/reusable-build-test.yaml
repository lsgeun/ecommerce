name: Reusable Build Test

on:
  workflow_call:

env:
  SPRING_CORE_API_DIR: './backend/spring-core-api'

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Repository 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 설정 및 Gradle 캐싱 통합
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여 및 CI 빌드/테스트
      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SPRING_CORE_API_DIR }}
        run: chmod +x ./gradlew

      - name: Build and test with Gradle
        working-directory: ${{ env.SPRING_CORE_API_DIR }}
        run: ./gradlew clean build

      # 4. 빌드 결과물(JAR 파일) 업로드
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ${{ env.SPRING_CORE_API_DIR }}/build/libs/*.jar
          retention-days: 1 # 1일 뒤 자동 삭제

      # 5. CI 빌드 실패 시에만 슬랙 알림
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *CI 빌드 실패!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *CI 빌드 또는 테스트 실패*\n• *Repository:* ${{ github.repository }}\n• *Branch:* ${{ github.head_ref || github.ref_name }}\n• *Author:* ${{ github.actor }}\n• *Action Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
