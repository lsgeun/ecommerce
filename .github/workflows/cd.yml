name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
      - test/28-product-user-domain

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }}
      CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}

    steps:
      # (1) 기본 체크아웃 (v4 적용)
      - name: Checkout
        uses: actions/checkout@v4

      # (2) JDK 17 세팅 (v4 적용 및 프로젝트 버전에 맞게 수정)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # (3) Gradle 설정 및 Caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # (4) Gradle build (Test 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. BuildKit 캐시 지원을 위한 필수 스텝
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Docker Hub 로그인 (docker/login-action 사용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Docker 이미지 빌드 및 Docker Hub 푸시 (docker/build-push-action 사용)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
      # (8) 실행 스크립트 권한 부여
      - name: Grant execute permission for scripts
        run: chmod +x scripts/*.sh

      # (9) 배포에 필요한 파일만 묶어서 압축 (배포 속도/용량 최적화)
      - name: Package deployment artifacts
        run: |
          mkdir -p deploy
          cp docker-compose.yml deploy/
          cp appspec.yml deploy/
          cp -r scripts deploy/
          cp -r nginx deploy/
          cd deploy && zip -r ../$GITHUB_SHA.zip .

      # (10) AWS 인증 (v4 적용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOYMENT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOYMENT_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # (11) S3에 필요한 zip 파일만 업로드
      - name: Upload to AWS S3
        run: |
          aws s3 cp $GITHUB_SHA.zip s3://$S3_BUCKET_NAME/$GITHUB_SHA.zip

      # (12) CodeDeploy 실행
      - name: Deploy to AWS EC2 from S3
        run: |
          aws deploy create-deployment \
            --application-name ${{ env.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name ${{ env.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=$S3_BUCKET_NAME,key=$GITHUB_SHA.zip,bundleType=zip