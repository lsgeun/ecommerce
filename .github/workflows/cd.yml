name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
      - test/28-product-user-domain

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }}
      CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}

    steps:
      # (1) 기본 체크아웃
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # (2) JDK 17 세팅
      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # (3) Gradle 설정 및 캐싱
      - name: Gradle 설정 및 캐싱
        uses: gradle/actions/setup-gradle@v4

      # (4) Gradle 빌드 (테스트 제외)
      - name: Gradle 빌드 실행 (테스트 제외)
        run: ./gradlew clean build -x test

      # (5) 도커 허브 기존 태그 삭제 스텝
      - name: 도커 허브 기존 이미지 태그 전체 삭제
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_DELETE_TOKEN }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          echo "=========================================="
          echo " [작업 시작] 도커 허브 이미지 다이제스트 삭제"
          echo "=========================================="
          
          # 1. 도커 허브 로그인 토큰(JWT) 발급
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"$DOCKER_USER\", \"password\": \"$DOCKER_PASS\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r '.token')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "❌ [오류] 도커 허브 인증 실패! Secrets 설정을 확인하세요."
            exit 1
          fi
          echo "✅ 도커 허브 인증 성공"
          
          # 2. 레포지토리 내 모든 이미지 다이제스트 추출 (중복 제거)
          DIGESTS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${DOCKER_REPOSITORY}/tags/?page_size=100" \
            | jq -r '.results[].digest // empty' | sort -u)
          
          if [ -z "$DIGESTS" ]; then
            echo "ℹ️ 삭제할 다이제스트가 없습니다."
            exit 0
          fi
          
          # 3. 다이제스트 순회 삭제
          DELETED_COUNT=0
          for DIGEST in $DIGESTS; do
            echo "🗑️ 다이제스트 삭제 중: $DIGEST"
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${DOCKER_REPOSITORY}/manifests/${DIGEST}")
          
            if [ "$HTTP_CODE" -eq 204 ] || [ "$HTTP_CODE" -eq 200 ]; then
              DELETED_COUNT=$((DELETED_COUNT+1))
            else
              echo "❌ [오류] 다이제스트 삭제 실패 (HTTP $HTTP_CODE): $DIGEST"
              echo "PAT 토큰에 Delete 권한이 있는지 확인하세요."
              exit 1
            fi
          done
          
          echo "✅ 총 ${DELETED_COUNT}개의 다이제스트 삭제 완료!"
          echo "=========================================="

      # (6) BuildKit 캐시 지원을 위한 설정
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # (7) Docker Hub 로그인
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # (8) Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # (9) 실행 스크립트 권한 부여
      - name: 배포 스크립트 실행 권한 부여
        run: chmod +x scripts/*.sh

      # (10) 배포에 필요한 파일 아티팩트 압축
      - name: 배포 아티팩트 패키징 (ZIP 압축)
        run: |
          echo "📦 배포 파일 압축 시작..."
          mkdir -p deploy
          cp docker-compose.yml deploy/
          cp appspec.yml deploy/
          cp -r scripts deploy/
          cp -r nginx deploy/
          cd deploy && zip -r ../$GITHUB_SHA.zip .
          echo "✅ 배포 파일 압축 완료: $GITHUB_SHA.zip"

      # (11) AWS 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOYMENT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOYMENT_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # (12) S3에 배포 파일 업로드
      - name: AWS S3에 배포 파일 업로드
        run: |
          echo "🚀 S3 업로드 시작..."
          aws s3 cp $GITHUB_SHA.zip s3://$S3_BUCKET_NAME/$GITHUB_SHA.zip
          echo "✅ S3 업로드 완료"

      # (13) AWS CodeDeploy 실행
      - name: AWS CodeDeploy 배포 요청
        run: |
          echo "🚀 EC2 배포 요청 시작..."
          aws deploy create-deployment \
            --application-name ${{ env.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name ${{ env.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=$S3_BUCKET_NAME,key=$GITHUB_SHA.zip,bundleType=zip
          echo "✅ AWS CodeDeploy 배포 요청 완료!"
