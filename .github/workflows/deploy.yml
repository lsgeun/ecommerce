name: Deploy to Amazon EC2

on:
  push:
    branches:
      - main
      - test/28-product-user-domain

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest

    steps:
      # 1. Repository 소스코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. JDK 17 설정 및 Gradle 캐싱 통합
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여 및 CI 빌드/테스트
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew clean build

      # 4. 빌드 결과물(JAR 파일) 업로드
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: build/libs/*.jar
          retention-days: 1 # 1일 뒤 자동 삭제

      # 5. CI 빌드 실패 시에만 슬랙 알림
      - name: Slack Notification on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *CI 빌드 실패!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *CI 빌드 또는 테스트 실패*\n• *Repository:* ${{ github.repository }}\n• *Branch:* ${{ github.ref_name }}\n• *Author:* ${{ github.actor }}\n• *Action Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy:
    needs: build-test

    name: deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }}
      CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: ${{ secrets.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}

    steps:
      # (1) 기본 체크아웃
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # (2) JDK 17 세팅
      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # (3) CI 단계에서 생성된 빌드 파일 다운로드
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: build/libs

      # (4) BuildKit 캐시 지원을 위한 설정
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      # (5) Docker Hub 로그인
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # (6) Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
          # 10GB 초과시 자동 삭제, 혹은 일정 기간 뒤 자동 삭제
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # (7) 실행 스크립트 권한 부여
      - name: 배포 스크립트 실행 권한 부여
        run: chmod +x scripts/*.sh

      # (8) 배포에 필요한 파일 아티팩트 압축
      - name: 배포 아티팩트 패키징 (ZIP 압축)
        run: |
          echo "📦 배포 파일 압축 시작..."
          mkdir -p deploy
          cp docker-compose.yml deploy/
          cp appspec.yml deploy/
          cp -r scripts deploy/
          cp -r nginx deploy/
          cp -r promtail deploy/
          cd deploy && zip -r ../$GITHUB_SHA.zip .
          echo "✅ 배포 파일 압축 완료: $GITHUB_SHA.zip"

      # (9) AWS 자격 증명 구성
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOYMENT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOYMENT_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # (10) S3에 배포 파일 업로드
      - name: AWS S3에 배포 파일 업로드
        run: |
          echo "🚀 S3 업로드 시작..."
          aws s3 cp $GITHUB_SHA.zip s3://$S3_BUCKET_NAME/$GITHUB_SHA.zip
          echo "✅ S3 업로드 완료"

      # (11) AWS CodeDeploy 실행
      - name: AWS CodeDeploy 배포 요청
        run: |
          echo "🚀 EC2 배포 요청 시작..."
          aws deploy create-deployment \
            --application-name ${{ env.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name ${{ env.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=$S3_BUCKET_NAME,key=$GITHUB_SHA.zip,bundleType=zip
          echo "✅ AWS CodeDeploy 배포 요청 완료!"

      # (12) CD 배포 실패 시에만 슬랙 알림
      - name: Slack Notification on Deploy Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *CD 배포 실패!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *EC2 배포 과정 실패*\n• *Repository:* ${{ github.repository }}\n• *Branch:* ${{ github.ref_name }}\n• *Author:* ${{ github.actor }}\n• *Action Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
