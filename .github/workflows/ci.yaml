name: Java-CI

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - "main"
      - "develop"
      - "feature/**"

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: ./gradlew test.
