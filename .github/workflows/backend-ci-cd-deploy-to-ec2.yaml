name: Backend CI/CD & Deploy to EC2

on:
  push:
    branches:
        - '**'

# 동일 브랜치에 연달아 Push할 경우 이전 실행 중인 워크플로우 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPRING_CORE_API_DIR: './backend/spring-core-api'
  AWS_CODEDEPLOY_DIR: './deploy/aws-codedeploy'
  EGINX_DIR: './gateway/nginx'
  PROMTAIL_DIR: './monitoring/promtail'

jobs:
  build-test:
    name: Build & Test
    # 기본적으로 항상 실행, 커밋 메시지에 [skip ci] 문구가 있다면 스킵
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    
    steps:
      # 1. Repository 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 설정 및 Gradle 캐싱 통합
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여 및 CI 빌드/테스트
      - name: Grant execute permission for gradlew
        working-directory: ${{ env.SPRING_CORE_API_DIR }}
        run: chmod +x ./gradlew

      - name: Build and test with Gradle
        working-directory: ${{ env.SPRING_CORE_API_DIR }}
        run: ./gradlew clean build

      # 4. 빌드 결과물(JAR 파일) 업로드
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ${{ env.SPRING_CORE_API_DIR }}/build/libs/*.jar
          retention-days: 1 # 1일 뒤 자동 삭제

      # 5. CI 빌드 실패 시에만 슬랙 알림
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "🚨 *CI 빌드 실패!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *CI 빌드 또는 테스트 실패*\n• *Repository:* ${{ github.repository }}\n• *Branch:* ${{ github.head_ref || github.ref_name }}\n• *Author:* ${{ github.actor }}\n• *Action Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }

  deploy:
    name: Deploy to EC2
    needs: build-test
    if: |
      needs.build-test.result == 'success' &&
      (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    environment: stage

    steps:
      # (1) 기본 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # (2) JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # (3) CI 단계에서 생성된 빌드 파일 다운로드
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ${{ env.SPRING_CORE_API_DIR }}/build/libs

      # (4) BuildKit 캐시 지원을 위한 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (5) Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # (6) Docker 이미지 빌드 및 Docker Hub 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.SPRING_CORE_API_DIR }}
          file: ${{ env.SPRING_CORE_API_DIR }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
          # 10GB 초과시 자동 삭제, 혹은 일정 기간 뒤 자동 삭제
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # (7) 실행 스크립트 권한 부여
      - name: Grant execute permission for scripts
        run: |
          chmod +x ${{ env.AWS_CODEDEPLOY_DIR }}/start.sh
          chmod +x ${{ env.AWS_CODEDEPLOY_DIR }}/stop.sh
      
      # (8) 배포에 필요한 파일 아티팩트 압축
      - name: Package deployment artifacts (ZIP)
        run: |
          echo "📦 배포 파일 압축 시작..."
          
          mkdir -p dist/scripts/deploy
          cp ${{ env.AWS_CODEDEPLOY_DIR }}/appspec.yml dist/
          cp ${{ env.AWS_CODEDEPLOY_DIR }}/start.sh dist/scripts/deploy/
          cp ${{ env.AWS_CODEDEPLOY_DIR }}/stop.sh dist/scripts/deploy/
          cp -r ${{ env.EGINX_DIR }} dist/
          cp -r ${{ env.PROMTAIL_DIR }} dist/
          cp ./docker-compose.yaml dist/
          cd dist && zip -r ../${{ github.sha }}.zip .
          
          echo "✅ 배포 파일 압축 완료: ${{ github.sha }}.zip"

      # (9) AWS 자격 증명 구성
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOYMENT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOYMENT_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # (10) S3에 배포 파일 업로드
      - name: Upload deployment package to S3
        run: |
          echo "🚀 S3 업로드 시작..."
          aws s3 cp ${{ github.sha }}.zip s3://${{ secrets.S3_BUCKET_NAME }}/${{ github.sha }}.zip
          echo "✅ S3 업로드 완료"

      # (11) AWS CodeDeploy 실행
      - name: Trigger AWS CodeDeploy
        run: |
          echo "🚀 EC2 배포 요청 시작..."
          aws deploy create-deployment \
            --application-name ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name ${{ secrets.CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.S3_BUCKET_NAME }},key=${{ github.sha }}.zip,bundleType=zip
          echo "✅ AWS CodeDeploy 배포 요청 완료!"

      # (12) CD 배포 실패 시에만 슬랙 알림
      - name: Notify Slack on deployment failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "🚨 *CD 배포 실패!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *EC2 배포 과정 실패*\n• *Repository:* ${{ github.repository }}\n• *Branch:* ${{ github.ref_name }}\n• *Author:* ${{ github.actor }}\n• *Action Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
