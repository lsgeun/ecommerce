name: Java Spring Boot CI

on:
  push:
    branches:
      - main
      - test/28-product-user-domain
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository 소스코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. JDK 17 설정 및 Gradle 캐싱 통합
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여 및 CI 빌드/테스트
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew clean test

      # 4. CI 빌드 실패 시에만 슬랙 알림
      - name: Slack Notification on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *CI 빌드 실패!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *CI 빌드 또는 테스트 실패*\n• *Repository:* ${{ github.repository }}\n• *Branch:* ${{ github.ref_name }}\n• *Author:* ${{ github.actor }}\n• *Action Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
